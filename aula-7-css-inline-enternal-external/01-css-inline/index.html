<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=z" />
    <title>CSS inline</title>
  </head>
  <body>
    <h1>Demostração de CSS inline</h1>
    <p style="color:blue; font-size: 24px;">Este parágrafo utiliza CSS inteligente através do atributo style.</p>
    <p
     style="color:red;
     font-weight: bold; 
     background-color:yellow;"
    >Outro parágrafo com múltiplas propriedades CSS inline.
    </p>

    <!-- padding: espaçamento interno / margin: espaçamento externo -->
    <div style="border: 2px solid green; width: 400px; padding: 30px; margin: 50px;">
        Está é uma dive estilizada com CSS inline.
    </div>

    <h2 style="color:blueviolet; text-align: center;">
        Título centralizado com cor hexadecimal 
    </h2>

    <div style="width: 600px; height: 400px; background-color: orange; color: white; font-size: 32px; text-align: center;">
        Desafio CSS inline
    </div>
  </body>
</html>
