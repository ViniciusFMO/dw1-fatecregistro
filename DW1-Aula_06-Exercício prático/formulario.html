<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro de Aluno</title>
</head>
<body>
    <h1>Cadastro de Aluno - DSM</h1>
    <p>Este formulário vai cadastra os Alunos do DSM</p>
    <form action="#" method="POST">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="nome">Nome completo:</label><br>
                <input type="text" id="nome" name="nome" required>
            </p>
            <p>
                <label for="email">E-mail</label><br>
                <input type="email" id="nome" name="email" required>
            </p>
            <p>
                <label for="dataNascimento">Data de Nascimento:</label><br>
                <input type="date" id="dataNascimento" name="dataNascimento">
            </p>
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados Acadêmicos</legend>
            <p>
                <label for="curso">Cursos:</label>
                <select id="curso" name="curso">
                    <option value="">Selecione um curso</option>
                    <option value="DSM">DSM</option>
                    <option value="ADS">ADS</option>
                    <option value="Outro">Outro</option>
                </select>
            </p>
            <p>
                Período:
            </p>
            <p>
                <input type="radio" id="manha" name="periodo" value="Manhã">
                <label for="manha">Manhã</label>
            </p>
                        <p>
                <input type="radio" id="noite" name="periodo" value="Noite">
                <label for="manha">noite</label>
            </p>
            <p>
                <label for="observacoes">Observações:</label>
                <textarea id="observacoes" name="observacoes" rows="5" cols="40"></textarea>
            </p>
        </fieldset>
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
