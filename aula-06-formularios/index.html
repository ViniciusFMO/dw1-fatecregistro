<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário no HTML5</h1>
    <form action="#" method="post">
        <label for="nome">Insira seu nome:</label><br>
        <!-- Input de text -->
         <input name="nome" type="text" id="nome" placeholder="Insira o nome completo..."><br>
        <!-- Input de email -->
         <label for="email">E-email:</label><br>
         <input name="email" type="email" id="email" placeholder="Insira seu email..."><br>
        <!-- Input de senha -->
         <label for="senha">Senha:</label><br>
         <input name="senha" type="password" id="senha" placeholder="Insira sua senha..."><br>
         <br>
         <!-- Botão de submeter o formulário -->
          <input type="submit" value="Cadastrar">
        <!--Botão de limpar o formulário  -->
        <input type="reset" value="Limpar">
    </form>
    <br><br>
    <hr  />
    <h4>Outros inputs:</h4>
    <form>
        <label>Quantidade:</label><br>
        <!-- Input de números -->
        <input type="number" min="0" max="10"> <br>
        <label>Data:</label><br>
        <!-- Input de números -->
         <input type="date" /><br><br>
        <!-- Input de arquivos -->
          <input type="file" />
        <!-- Campo de texto longo (textarea) -->
         <label>Comentário</label><br>
         <textarea rows="4" cols="40"></textarea>
         <!-- Campo invisível -->
          <input type="hidden" name="idProduto" value="9" />
          <!-- Caixa de seleção -->
           <label>Cursos:</label>
           <select name="cursos">
            <option value="1">Programação</option>
            <option value="2">Design Gráfico</option>
            <option value="3">Música</option>
            <option value="4">Enfermagem</option>
           </select>
    </form>
    <br><br>
    <hr>
    <h2>Exemplo de formulário completo:</h2>
    <!-- Formulário completo -->
     <form action="#" method="post">
        <fieldset>
            <legend>Dados pessoais:</legend>
            <label for="name">Nome:*</label>
            <input type="text" placeholder="Insira seu nome..." id="name" name="name" required><br>
            <label for="nascimento">Data de nascimento</label>
            <input type="date">
            <label for="sexo">Sexo:</label>
            <!-- Radio buttons -->
             <input type="radio" name="sexo">Masculino
             <input type="radio" name="sexo">Feminino
             <input type="radio" name="sexo">Prefiro não informar
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados de endereço:</legend>
            <label for="rua">Rua:</label>
            <input type="text">
            <label for="numero">Número</label>
            <input type="number">
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados do produto:</legend>
            <label>Cor do produto</label>
            <input type="color">
            <!-- Checkbox -->
            <input type="checkbox" required>Li e aceito os termos de uso
            <br><br>
            <input type="text" placeholder="Este campo está desativado" disabled><br><br>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">
        </fieldset>
     </form>
</body>
</html>
